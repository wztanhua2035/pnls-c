<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>坡南龙蛇｜管理后台</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page-shell admin-shell"><header class="simple-head"><a href="/">← 返回游戏</a><div><span class="eyebrow">ADMIN CONSOLE</span><h1>坡南龙蛇 · 管理后台</h1></div></header>
<section id="adminLogin" class="card admin-login"><h2>管理员登录</h2><form id="adminLoginForm"><label>管理密码<input id="adminPassword" type="password" autocomplete="current-password" required></label><button class="primary">登录</button><p id="adminLoginMessage" class="message"></p></form></section>
<section id="adminPanel" class="hidden"><div class="admin-nav card"><button class="tab active" data-tab="accounts">游戏账号</button><button class="tab" data-tab="models">AI 模型</button><button class="tab" data-tab="security">安全设置</button><button id="adminLogout" class="ghost">退出后台</button></div>
<section id="tab-accounts" class="admin-tab card"><div class="section-title"><div><span class="eyebrow">ACCOUNTS</span><h2>游戏账号与时长</h2></div><button id="refreshAdmin" class="secondary">刷新</button></div><div class="table-wrap"><table><thead><tr><th>主角姓名</th><th>累计游戏时间</th><th>剧情回合</th><th>最近游戏</th></tr></thead><tbody id="accountRows"></tbody></table></div></section>
<section id="tab-models" class="admin-tab card hidden"><div class="section-title"><div><span class="eyebrow">AI PROVIDERS</span><h2>模型接口管理</h2></div></div><p class="muted">支持 OpenAI 兼容的 <code>chat/completions</code> 接口。密钥经加密后保存在服务器。</p><form id="modelForm" class="model-form"><label>配置名称<input name="name" placeholder="例如：主模型" required></label><label>接口根地址<input name="baseUrl" type="url" placeholder="https://api.openai.com/v1" required></label><label>模型名称<input name="model" placeholder="模型 ID" required></label><label>API Key<input name="apiKey" type="password" autocomplete="off" required></label><button class="primary">添加模型</button></form><p id="modelMessage" class="message"></p><div id="modelList" class="model-list"></div></section>
<section id="tab-security" class="admin-tab card hidden"><span class="eyebrow">SECURITY</span><h2>修改管理密码</h2><form id="passwordForm" class="password-form"><label>当前密码<input name="currentPassword" type="password" required></label><label>新密码（至少8位）<input name="newPassword" type="password" minlength="8" required></label><button class="primary">修改密码</button></form><p id="passwordMessage" class="message"></p></section>
</section></main><script src="admin.js" type="module"></script></body></html>
